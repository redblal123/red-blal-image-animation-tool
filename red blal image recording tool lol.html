<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RED BLAL EASY ANIMATING TOOL</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
        margin: 0; padding: 0; background: #050000; overflow: hidden; 
        display: flex; justify-content: center; align-items: center; height: 100vh;
        font-family: 'Impact', 'Arial Black', sans-serif; color: #fff;
        touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #app { width: 100vw; height: 100vh; background: #111; display: flex; flex-direction: column; }
    #header {
        background: #ff0055; color: #fff; padding: 8px;
        font-size: 14px; font-weight: bold; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
        border-bottom: 4px solid #000; text-shadow: 2px 2px 0 #000; gap: 6px;
    }
    #controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
    
    .btn {
        background: #00ffff; color: #000; border: 3px solid #000; padding: 8px 12px;
        font-size: 14px; font-weight: bold; cursor: pointer; font-family: 'Impact', sans-serif;
        transform: skewX(-10deg); transition: 0.1s; min-height: 40px;
        display: flex; align-items: center; justify-content: center;
    }
    .btn:active { transform: skewX(-10deg) scale(0.95); background: #fff; }
    .btn-red { background: #ff0000; color: #fff; }
    .btn-green { background: #00ff00; }
    .btn-yellow { background: #ffff00; }
    .btn-purple { background: #ff00ff; color: #fff; }
    .btn-orange { background: #ff8800; color: #fff; }

    #canvasContainer { flex: 1; background: #000; position: relative; overflow: hidden; border-bottom: 4px solid #444; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #uiOverlay { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 2px 2px 0 #000; }
    #modeDisplay { font-size: 20px; color: #00ffff; margin-bottom: 5px; }
    #recIndicator { font-size: 20px; color: #ff0000; display: none; animation: blink 0.5s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    #footer { padding: 8px; background: #1a1a1a; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-top: 4px solid #444; gap: 8px; }
    .instructions { font-size: 12px; color: #aaa; line-height: 1.2; }
    .instructions span { color: #ffff00; font-weight: bold; }
    #imgInput { display: none; }
</style>
</head>
<body>

<div id="app">
    <div id="header">
        <div>RED BLAL EASY ANIMATING TOOL</div>
        <div id="controls">
            <button class="btn" onclick="document.getElementById('imgInput').click()">➕ ADD</button>
            <button class="btn btn-purple" id="modeBtn"> DRAG</button>
            <button class="btn btn-orange" id="multiBtn"> MULTI: OFF</button>
            <button class="btn btn-yellow" id="resetBtn"> RESET</button>
            <button class="btn btn-green" id="hudBtn">👁️ HUD: ON</button>
            <button class="btn btn-green" id="recBtn">⏺ REC</button>
            <button class="btn btn-red" id="stopBtn" style="display:none;"> STOP</button>
        </div>
    </div>
    <input type="file" id="imgInput" accept="image/*" multiple>
    
    <div id="canvasContainer">
        <canvas id="animCanvas" width="1280" height="720"></canvas>
        <div id="uiOverlay">
            <div id="modeDisplay">MODE: DRAG</div>
            <div id="recIndicator">● REC</div>
        </div>
    </div>

    <div id="footer">
        <div class="instructions">
            TAP <span>🔄</span> FOR MODES | <span>M2 (RIGHT CLICK)</span> IN SPRING MOVES ANCHOR<br>
            PRESS <span>F</span> TO RECORD! SWING THE HAMMER!
        </div>
        <div class="instructions" id="statusText">ADD IMAGES BAKA!</div>
    </div>
</div>

<script>
const canvas = document.getElementById('animCanvas');
const ctx = canvas.getContext('2d');
const imgInput = document.getElementById('imgInput');
const recBtn = document.getElementById('recBtn');
const stopBtn = document.getElementById('stopBtn');
const resetBtn = document.getElementById('resetBtn');
const modeBtn = document.getElementById('modeBtn');
const multiBtn = document.getElementById('multiBtn');
const hudBtn = document.getElementById('hudBtn');
const modeDisplay = document.getElementById('modeDisplay');
const recIndicator = document.getElementById('recIndicator');
const statusText = document.getElementById('statusText');

let layers = []; 
let selectedLayers = []; 
let isMultiSelect = false;
let showHud = true; // NEW: HUD TOGGLE
let mode = 0; 
const modes = ['DRAG', 'STRETCH', 'SPIN', 'SPRING', 'HAMMER'];
const modeColors = ['#00ffff', '#00ff00', '#ff00ff', '#ff8800', '#ff4400'];

let isDragging = false;
let isM2Dragging = false; 
let activeHandle = 0; 
let lastX = 0, lastY = 0;
let mouseX = 0, mouseY = 0;
let mediaRecorder, recordedChunks = [], isRecording = false;

let bonkTexts = [];
let canvasShake = 0;
let lastBonkTime = 0; // NEW: BONK COOLDOWN

const hammer = {
    x: 640, y: 360, vx: 0, vy: 0,
    angle: 0, headRadius: 45
};

class Layer {
    constructor(img) {
        this.img = img;
        const maxW = canvas.width * 0.3;
        const maxH = canvas.height * 0.3;
        const fitScale = Math.min(maxW / img.width, maxH / img.height);
        this.w = img.width * fitScale;
        this.h = img.height * fitScale;
        this.x = (canvas.width - this.w) / 2 + (Math.random() * 100 - 50);
        this.y = (canvas.height - this.h) / 2 + (Math.random() * 100 - 50);
        
        this.baseX = this.x; this.baseY = this.y;
        this.baseW = this.w; this.baseH = this.h;
        this.rot = 0; this.baseRot = 0;
        
        this.vx = 0; this.vy = 0; this.vRot = 0;
        this.sqX = 1; this.sqY = 1; 
        this.splatX = 1; this.splatY = 1; // NEW: CARTOON SPLAT SCALE
    }
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

imgInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    let loadedCount = 0;
    files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                layers.push(new Layer(img));
                selectedLayers = [layers[layers.length - 1]]; 
                loadedCount++;
                if (loadedCount === files.length) statusText.innerText = `ADDED ${files.length} IMAGE(S)!`;
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });
    e.target.value = ''; 
});

function cycleMode() {
    mode = (mode + 1) % modes.length;
    modeDisplay.innerText = `MODE: ${modes[mode]}`;
    modeDisplay.style.color = modeColors[mode];
    modeBtn.innerText = `🔄 ${modes[mode]}`;
    playBeep(400 + mode * 150);
}
modeBtn.addEventListener('click', cycleMode);

multiBtn.addEventListener('click', () => {
    isMultiSelect = !isMultiSelect;
    multiBtn.innerText = `👆 MULTI: ${isMultiSelect ? 'ON' : 'OFF'}`;
    multiBtn.style.background = isMultiSelect ? '#00ff00' : '#ff8800';
    playBeep(isMultiSelect ? 800 : 400);
});

// NEW: HUD TOGGLE
hudBtn.addEventListener('click', () => {
    showHud = !showHud;
    hudBtn.innerText = showHud ? '👁️ HUD: ON' : '🙈 HUD: OFF';
    hudBtn.style.background = showHud ? '#ffff00' : '#555';
    playBeep(showHud ? 600 : 300);
});

resetBtn.addEventListener('click', () => {
    selectedLayers.forEach(l => {
        l.x = l.baseX; l.y = l.baseY; l.w = l.baseW; l.h = l.baseH;
        l.rot = l.baseRot; l.vx = 0; l.vy = 0; l.vRot = 0; 
        l.sqX = 1; l.sqY = 1; l.splatX = 1; l.splatY = 1;
    });
    bonkTexts = [];
    playBeep(1000);
});

function spawnBonk(x, y) {
    bonkTexts.push({ x, y, text: 'BONK!', life: 40, max: 40, scale: 2.0 });
    bonkTexts.push({ x: x + (Math.random()-0.5)*60, y: y - 40, text: 'SPLAT!', life: 30, max: 30, scale: 1.5 });
}

function playBonkSound() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (canvasShake > 0) {
        ctx.save();
        ctx.translate((Math.random()-0.5)*canvasShake, (Math.random()-0.5)*canvasShake);
        canvasShake *= 0.85;
        if(canvasShake < 0.5) canvasShake = 0;
    }

    // ONLY DRAW GRID IF HUD IS ON
    if (showHud) {
        ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }
    }

    // --- HAMMER PHYSICS UPDATE ---
    if (mode === 4) {
        let dx = mouseX - hammer.x;
        let dy = mouseY - hammer.y;
        hammer.vx += dx * 0.12; 
        hammer.vy += dy * 0.12;
        hammer.vx *= 0.88; 
        hammer.vy *= 0.88;
        hammer.x += hammer.vx;
        hammer.y += hammer.vy;
        
        let speed = Math.hypot(hammer.vx, hammer.vy);
        if (speed > 1) hammer.angle = Math.atan2(hammer.vy, hammer.vx);

        // COLLISIONS WITH IMAGES
        layers.forEach(l => {
            let cx = l.x + l.w/2;
            let cy = l.y + l.h/2;
            let dist = Math.hypot(hammer.x - cx, hammer.y - cy);
            let hitRadius = hammer.headRadius + Math.max(l.w, l.h)/2;
            
            // NEW: 3 SECOND COOLDOWN CHECK!
            if (dist < hitRadius && speed > 3 && Date.now() - lastBonkTime > 3000) {
                let angle = Math.atan2(cy - hammer.y, cx - hammer.x);
                l.vx += Math.cos(angle) * speed * 4;
                l.vy += Math.sin(angle) * speed * 4;
                l.vRot += (Math.random() - 0.5) * 1.5;
                
                // NEW: CARTOON PUDDLE SPLAT! (Wide and Flat)
                l.splatX = 2.5; 
                l.splatY = 0.15; 
                
                spawnBonk(hammer.x, hammer.y);
                playBonkSound();
                canvasShake = 25;
                
                lastBonkTime = Date.now(); // SET COOLDOWN
                
                hammer.vx *= -0.4;
                hammer.vy *= -0.4;
            }
        });
    }

    layers.forEach(layer => {
        // RECOVER SPLAT
        layer.splatX += (1.0 - layer.splatX) * 0.08;
        layer.splatY += (1.0 - layer.splatY) * 0.08;

        // JELLY SPRING PHYSICS
        if (mode === 3 && !isDragging && !isM2Dragging && selectedLayers.includes(layer)) {
            const stiffness = 0.08; const damping = 0.88;   
            layer.vx += (layer.baseX - layer.x) * stiffness;
            layer.vy += (layer.baseY - layer.y) * stiffness;
            layer.vx *= damping; layer.vy *= damping;
            layer.x += layer.vx; layer.y += layer.vy;
            
            layer.vRot += (layer.baseRot - layer.rot) * stiffness;
            layer.vRot *= damping;
            layer.rot += layer.vRot;

            const speed = Math.sqrt(layer.vx*layer.vx + layer.vy*layer.vy);
            layer.sqX = 1 + (speed * 0.04); 
            layer.sqY = 1 - (speed * 0.02);
        } else {
            layer.sqX += (1 - layer.sqX) * 0.2;
            layer.sqY += (1 - layer.sqY) * 0.2;
        }

        const centerX = layer.x + layer.w / 2;
        const centerY = layer.y + layer.h / 2;

        ctx.save();
        ctx.translate(centerX, centerY);
        
        if (mode === 3) {
            const angle = Math.atan2(layer.vy, layer.vx);
            ctx.rotate(angle);
            ctx.scale(layer.sqX, layer.sqY);
            ctx.rotate(-angle);
        }
        
        ctx.rotate(layer.rot);
        
        // APPLY CARTOON SPLAT SCALE
        ctx.scale(layer.splatX, layer.splatY);
        
        ctx.drawImage(layer.img, -layer.w / 2, -layer.h / 2, layer.w, layer.h);
        ctx.restore();

        // ONLY DRAW HUD IF ENABLED
        if (showHud && selectedLayers.includes(layer)) {
            ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 3; ctx.setLineDash([10, 5]);
            ctx.strokeRect(layer.x, layer.y, layer.w, layer.h);
            ctx.setLineDash([]);
            
            if (mode === 1) {
                ctx.fillStyle = '#00ff00'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
                const hs = 24; // EXACT HITBOX SIZE
                
                // Right
                let rx = layer.x + layer.w, ry = centerY;
                ctx.fillRect(rx - hs/2, ry - hs/2, hs, hs); ctx.strokeRect(rx - hs/2, ry - hs/2, hs, hs);
                // Left
                let lx = layer.x;
                ctx.fillRect(lx - hs/2, ry - hs/2, hs, hs); ctx.strokeRect(lx - hs/2, ry - hs/2, hs, hs);
                // Bottom
                let bx = centerX, by = layer.y + layer.h;
                ctx.fillRect(bx - hs/2, by - hs/2, hs, hs); ctx.strokeRect(bx - hs/2, by - hs/2, hs, hs);
                // Top
                let ty = layer.y;
                ctx.fillRect(bx - hs/2, ty - hs/2, hs, hs); ctx.strokeRect(bx - hs/2, ty - hs/2, hs, hs);
            }
        }
    });

    // Draw Bonk Texts
    bonkTexts.forEach((b, i) => {
        b.y -= 3; b.life--; b.scale += 0.05;
        ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.scale, b.scale);
        ctx.rotate((Math.random()-0.5)*0.3);
        ctx.fillStyle = '#ffff00'; ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 4;
        ctx.font = 'bold 40px Impact'; ctx.textAlign = 'center';
        ctx.strokeText(b.text, 0, 0); ctx.fillText(b.text, 0, 0);
        ctx.restore();
        if (b.life <= 0) bonkTexts.splice(i, 1);
    });

    // Draw Physical Hammer
    if (mode === 4) {
        ctx.save();
        ctx.translate(hammer.x, hammer.y);
        ctx.rotate(hammer.angle);
        ctx.fillStyle = '#8B4513'; ctx.fillRect(-70, -6, 70, 12);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-70, -6, 70, 12);
        ctx.fillStyle = '#888'; ctx.fillRect(-15, -30, 50, 60);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeRect(-15, -30, 50, 60);
        ctx.fillStyle = '#aaa'; ctx.fillRect(-10, -25, 40, 10);
        ctx.restore();
    }

    if (layers.length === 0) {
        ctx.fillStyle = '#444'; ctx.font = '40px Impact'; ctx.textAlign = 'center';
        ctx.fillText('ADD IMAGES TO START BAKA!', canvas.width/2, canvas.height/2);
    }

    if (canvasShake > 0) ctx.restore();
    requestAnimationFrame(draw);
}
draw();

function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

function handleStart(e) {
    if (!layers.length) return;
    const coords = getCoords(e);
    lastX = coords.x; lastY = coords.y;
    mouseX = coords.x; mouseY = coords.y;

    let clickedLayer = null;
    for (let i = layers.length - 1; i >= 0; i--) {
        const l = layers[i];
        if (coords.x > l.x && coords.x < l.x + l.w && coords.y > l.y && coords.y < l.y + l.h) {
            clickedLayer = l; break;
        }
    }

    if (clickedLayer) {
        if (isMultiSelect) {
            const idx = selectedLayers.indexOf(clickedLayer);
            if (idx > -1) selectedLayers.splice(idx, 1); else selectedLayers.push(clickedLayer); 
        } else { selectedLayers = [clickedLayer]; }

        if (mode === 3 && e.button === 2) {
            isM2Dragging = true;
        } 
        // NEW: HITBOX ACCURATE SCALE HANDLES
        else if (mode === 1 && selectedLayers.length === 1) { 
            const l = selectedLayers[0];
            const cx = l.x + l.w / 2; const cy = l.y + l.h / 2; 
            const hs = 24; // EXACT MATCH TO VISUAL
            
            // Right
            if (Math.abs(coords.x - (l.x + l.w)) < hs && Math.abs(coords.y - cy) < hs) activeHandle = 1; 
            // Left
            else if (Math.abs(coords.x - l.x) < hs && Math.abs(coords.y - cy) < hs) activeHandle = 2; 
            // Bottom
            else if (Math.abs(coords.x - cx) < hs && Math.abs(coords.y - (l.y + l.h)) < hs) activeHandle = 3; 
            // Top
            else if (Math.abs(coords.x - cx) < hs && Math.abs(coords.y - l.y) < hs) activeHandle = 4; 
            else activeHandle = 0; 
        } 
        else { isDragging = true; }
    } else {
        if (!isMultiSelect) selectedLayers = [];
    }
}

function handleMove(e) {
    const coords = getCoords(e);
    mouseX = coords.x; mouseY = coords.y;

    if (selectedLayers.length === 0) return;
    const deltaX = coords.x - lastX;
    const deltaY = coords.y - lastY;

    selectedLayers.forEach(l => {
        if (mode === 0 && isDragging) { l.x += deltaX; l.y += deltaY; } 
        else if (mode === 1 && activeHandle !== 0 && selectedLayers.length === 1) { 
            if (activeHandle === 1) l.w += deltaX; 
            else if (activeHandle === 2) { l.x += deltaX; l.w -= deltaX; } 
            else if (activeHandle === 3) l.h += deltaY; 
            else if (activeHandle === 4) { l.y += deltaY; l.h -= deltaY; } 
        } else if (mode === 2 && isDragging) { l.rot += deltaX * 0.01; }
        else if (mode === 3 && isDragging) { l.x += deltaX; l.y += deltaY; }
        else if (mode === 3 && isM2Dragging) { 
            l.x += deltaX; l.y += deltaY; 
            l.baseX = l.x; l.baseY = l.y; 
        }
    });

    lastX = coords.x; lastY = coords.y;
}

function handleEnd(e) { 
    isDragging = false; 
    isM2Dragging = false; 
    activeHandle = 0; 
}

canvas.addEventListener('pointerdown', handleStart);
canvas.addEventListener('pointermove', handleMove);
canvas.addEventListener('pointerup', handleEnd);
canvas.addEventListener('pointercancel', handleEnd);

window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'z') cycleMode();
    if (e.key.toLowerCase() === 'f') { if (!isRecording) startRec(); else stopRec(); }
});

function playBeep(freq) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

recBtn.addEventListener('click', startRec);
stopBtn.addEventListener('click', stopRec);

function startRec() {
    if (layers.length === 0) { alert("ADD AN IMAGE FIRST BAKA!"); return; }
    recordedChunks = [];
    const stream = canvas.captureStream(60); 
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `RED_BLAL_ANIM_${Date.now()}.webm`;
        a.click();
        statusText.innerText = "VIDEO DOWNLOADED!";
    };
    mediaRecorder.start(); isRecording = true;
    recBtn.style.display = 'none'; stopBtn.style.display = 'flex';
    recIndicator.style.display = 'block';
    statusText.innerText = "RECORDING...";
}

function stopRec() {
    if (isRecording) {
        mediaRecorder.stop(); isRecording = false;
        recBtn.style.display = 'flex'; stopBtn.style.display = 'none';
        recIndicator.style.display = 'none';
    }
}
</script>
</body>
</html>
